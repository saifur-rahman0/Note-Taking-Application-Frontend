<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — NoteApp</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">📝 NoteApp</div>
    <h1 class="auth-title">Create account</h1>
    <p class="auth-sub">Join NoteApp today</p>

    <div id="error-box" class="alert alert-error hidden"></div>

    <form id="register-form" autocomplete="off">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Min. 6 characters" required />
      </div>
      <div class="form-group">
        <label for="interests">Interests <span class="label-hint">(comma-separated, optional)</span></label>
        <input type="text" id="interests" name="interests" placeholder="chess, reading, coding" />
      </div>
      <button type="submit" id="register-btn" class="btn btn-primary btn-full">Create Account</button>
    </form>

    <p class="auth-footer">Already have an account? <a href="login.html">Sign In</a></p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
